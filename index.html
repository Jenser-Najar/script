<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Improvement Script</title>
    <style>
        :root {
            --primary: #2f66ff;
            --secondary: #1f4dcc;
            --bg-light: #101522;
            --sidebar-bg: #151d31;
            --text-dark: #f4f7ff;
            --text-soft: #d5ddf7;
            --border: rgba(180, 198, 235, 0.28);
            --card-bg: #121a2c;
            --base-font: 24px;
            --line-height: 1.95;
        }

        body {
            margin: 0;
            font-family: "IBM Plex Sans", "Segoe UI", Tahoma, sans-serif;
            font-size: var(--base-font);
            line-height: var(--line-height);
            display: flex;
            background: var(--bg-light);
            color: var(--text-dark);
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
        }

        body.login-locked #leftbar,
        body.login-locked #sidebar,
        body.login-locked #main {
            filter: blur(12px);
            pointer-events: none;
            user-select: none;
        }

        #loginOverlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(11, 15, 20, 0.56);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 9999;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        #loginOverlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .login-panel {
            width: min(92vw, 420px);
            padding: 28px 24px 20px;
            border-radius: 18px;
            background: rgba(20, 27, 38, 0.94);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
        }

        .login-panel h2 {
            margin: 0 0 14px;
            color: #f2f6ff;
            text-align: center;
            font-size: 28px;
        }

        .login-field {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
            color: #dfe7ff;
            font-size: 14px;
            font-weight: 600;
        }

        .login-field input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid rgba(171, 192, 255, 0.25);
            background: rgba(255, 255, 255, 0.05);
            color: #f7f9ff;
            font-size: 15px;
            outline: none;
        }

        .login-field input:focus {
            border-color: rgba(96, 170, 255, 0.8);
            box-shadow: 0 0 0 3px rgba(96, 170, 255, 0.18);
        }

        .login-button {
            width: 100%;
            margin: 0;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid rgba(113, 168, 255, 0.4);
            background: linear-gradient(135deg, #2f66ff, #1c48c9);
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .login-button:hover {
            background: linear-gradient(135deg, #447dff, #234fc9);
        }

        #loginError {
            min-height: 20px;
            margin-top: 12px;
            color: #ff9aa3;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
        }

        #sidebar,
        #leftbar {
            position: fixed;
            top: 0;
            width: 240px;
            height: 100vh;
            background: var(--sidebar-bg);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
            display: flex;
            flex-direction: column;
            align-items: stretch;
            padding-top: 18px;
            box-sizing: border-box;
            z-index: 100;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #2f4f87 transparent;
        }

        #sidebar {
            right: 0;
            border-left: 1px solid var(--border);
        }

        #leftbar {
            left: 0;
            border-right: 1px solid var(--border);
        }

        button {
            margin: 6px 12px;
            padding: 15px 14px;
            border: 1px solid rgba(145, 171, 232, 0.34);
            border-radius: 11px;
            background: #1a2744;
            color: #e8eeff;
            cursor: pointer;
            text-align: left;
            transition: background 0.2s ease, transform 0.15s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            font-size: 17px;
            font-weight: 600;
            font-family: "Manrope", "IBM Plex Sans", sans-serif;
            letter-spacing: 0.01em;
        }

        .lang-toggle {
            background: linear-gradient(135deg, #d62828, #a31212);
            border-color: rgba(255, 166, 166, 0.7);
            color: #fff;
            font-weight: 800;
        }

        .lang-toggle:hover {
            background: linear-gradient(135deg, #ef4444, #b91c1c);
            border-color: rgba(255, 214, 214, 0.9);
        }

        button:hover {
            background: #21345e;
            transform: translateY(-1px);
            color: #fff;
            border-color: rgba(155, 219, 255, 0.7);
            box-shadow: 0 6px 16px rgba(4, 13, 33, 0.55);
        }

        button.active {
            background: #245fd6;
            border-color: #67e8f9;
            box-shadow: 0 0 0 3px rgba(103, 232, 249, 0.3), 0 8px 20px rgba(4, 13, 33, 0.65);
        }

        button:focus-visible {
            outline: 2px solid #57d1ff;
            outline-offset: 2px;
        }

        button:active {
            transform: translateY(0);
        }

        #main {
            flex: 1;
            padding: 82px 34px 34px;
            margin-right: 240px;
            margin-left: 240px;
            overflow-y: auto;
        }

        .page-toggle {
            position: fixed;
            top: 14px;
            left: 50%;
            z-index: 200;
            margin: 0;
            transform: translateX(-50%);
            background: #f2b84b;
            border-color: #ffe1a0;
            color: #20170a;
            white-space: nowrap;
        }

        .page-toggle:hover {
            background: #ffd166;
            color: #20170a;
            transform: translateX(-50%) translateY(-1px);
        }

        #content {
            max-width: 820px;
            line-height: 2;
            white-space: pre-wrap;
            font-size: 1.35rem;
            font-weight: 550;
            letter-spacing: 0.01em;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 34px 38px;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.38);
        }

        .subheading {
            color: #9fcbff;
            font-family: "Manrope", "IBM Plex Sans", sans-serif;
            font-weight: 800;
            letter-spacing: 0.02em;
            text-transform: none;
            font-size: 1.05rem;
        }

        .said-line {
            color: var(--text-dark);
            display: block;
            margin-bottom: 6px;
        }

        .meta-line {
            color: #ffe2a8;
            font-weight: 700;
            display: block;
            margin: 8px 0;
            padding: 6px 10px;
            background: rgba(255, 214, 130, 0.12);
            border-left: 4px solid #ffd06b;
            border-radius: 8px;
        }

        #content p {
            margin: 0;
            color: var(--text-soft);
        }

        #sidebar::-webkit-scrollbar,
        #leftbar::-webkit-scrollbar {
            width: 10px;
        }

        #sidebar::-webkit-scrollbar-thumb,
        #leftbar::-webkit-scrollbar-thumb {
            background: rgba(94, 140, 221, 0.6);
            border-radius: 999px;
        }

        #sidebar::-webkit-scrollbar-track,
        #leftbar::-webkit-scrollbar-track {
            background: transparent;
        }

        @media (max-width: 900px) {
            :root {
                --base-font: 20px;
            }

            #sidebar,
            #leftbar {
                width: 185px;
            }

            #main {
                padding: 20px 14px;
                margin-right: 185px;
                margin-left: 185px;
            }

            #content {
                font-size: 1.1rem;
                line-height: 1.9;
                padding: 18px 16px;
            }

            button {
                font-size: 15px;
                padding: 12px 12px;
            }
        }

        }

        .said-line,

        #content>* {
            animation: content-arrive 0.35s ease both;
        }

        @keyframes content-arrive {
            from {
                opacity: 0;

            to {

        #sidebar::-webkit-scrollbar-thumb,
        #leftbar::-webkit-scrollbar-thumb {
            background: rgba(88, 120, 110, 0.35);
        }

        @media (max-width: 900px) {

            #sidebar,
            #leftbar {
                width: 204px;
            }

            #main {

        }

        /* Signature product layer: an editorial control room for the script. */
        :root {
            --ink: #304046;
            --ink-muted: #708083;
            --paper: #fcf9f4;
            --paper-deep: #eee6dc;
            --rose: #a9575e;
            --rose-deep: #7f3e47;
            --moss: #71877b;
            --moss-deep: #526c60;
            --line: rgba(48, 64, 70, 0.13);
            --rail-width: 232px;
        }

        body {
            background-color: var(--bg-light);
            background-image:
                linear-gradient(rgba(113, 135, 123, 0.045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(113, 135, 123, 0.045) 1px, transparent 1px),
                linear-gradient(135deg, rgba(169, 87, 94, 0.035), transparent 42%);
            background-size: 48px 48px, 48px 48px, auto;
        }

        #leftbar,
        #sidebar {
            width: var(--rail-width);
            padding: 78px 16px 24px;
            background: rgba(249, 246, 241, 0.92);
            border-color: var(--line);
            box-shadow: 0 14px 36px rgba(76, 58, 46, 0.075);
        }

        #leftbar::before,
        #sidebar::before {
            position: absolute;
            top: 28px;
            left: 18px;
            color: var(--ink-muted);
            content: "";
            font-family: "DM Sans", sans-serif;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.18em;
        }

        #leftbar::before {
            content: "CALL GUIDE";
        }

        #sidebar::before {
            content: "RESPONSES";
        }

        #leftbar::after,
        #sidebar::after {
            position: absolute;
            top: 47px;
            left: 18px;
            width: 42px;
            height: 2px;
            background: var(--rose);
            content: "";
        }

        #main {
            position: relative;
            isolation: isolate;
            margin-right: var(--rail-width);
            margin-left: var(--rail-width);
            padding: 86px 40px 56px;
        }

        #main::before {
            position: absolute;
            top: 39px;
            left: 40px;
            color: var(--ink-muted);
            content: "HOME IMPROVEMENT / FIELD SCRIPT";
            font-family: "DM Sans", sans-serif;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.2em;
        }

        #main::after {
            position: absolute;
            top: 40px;
            right: 40px;
            width: 34px;
            height: 34px;
            border-top: 1px solid rgba(169, 87, 94, 0.55);
            border-right: 1px solid rgba(169, 87, 94, 0.55);
            content: "";
        }

            position: relative;
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 52px;
            padding: 12px 13px;
            border-color: rgba(113, 135, 123, 0.2);
            border-radius: 14px;
            background: rgba(255, 253, 249, 0.74);
            color: var(--ink);

            const isCalifornia = pageMode === 'california';
            toggle.hidden = isCalifornia;
            toggle.style.display = isCalifornia ? 'none' : '';
            toggle.setAttribute('aria-hidden', String(isCalifornia));
            toggle.textContent = languageState.current === 'en' ? 'Español' : 'English';
            toggle.dataset.langToggle = languageState.current === 'en' ? 'es' : 'en';

            const mainButtons = document.querySelectorAll('#leftbar [data-section]');
            const rebuttalButtons = document.querySelectorAll('#sidebar [data-section]');
            const currentData = scriptData[languageState.current];

            mainButtons.forEach(button => {
                const key = button.dataset.miamiSection;
                button.dataset.section = key;
                button.hidden = key === 'unused';
                button.textContent = currentData.labels[key] || key;
            });

            rebuttalButtons.forEach(button => {
                const key = button.dataset.miamiSection;
                button.dataset.section = key;
                button.hidden = key === 'unused';
                button.textContent = currentData.labels[key] || key;
            });

            const active = document.querySelector('[data-section].active:not([hidden])');
            const firstButton = document.querySelector('#leftbar [data-section]:not([hidden])');
            let selectedSection = active ? active.getAttribute('data-section') : firstButton.getAttribute('data-section');
            renderSection(selectedSection);
        }

        document.querySelectorAll('[data-section]').forEach(button => {
            button.dataset.miamiSection = button.dataset.section;
        });

        document.getElementById('pageToggle').addEventListener('click', () => {
            pageMode = pageMode === 'miami' ? 'california' : 'miami';
            document.querySelectorAll('[data-section]').forEach(button => button.classList.remove('active'));
            document.getElementById('pageToggle').textContent = pageMode === 'miami' ? 'California' : 'Miami';
            applyLanguage(languageState.current);
        });

        document.getElementById('languageToggle').addEventListener('click', () => {
            const nextLang = document.getElementById('languageToggle').dataset.langToggle === 'es' ? 'es' : 'en';
            applyLanguage(nextLang);
        });

        document.querySelectorAll('[data-section]').forEach(button => {
            button.addEventListener('click', () => {
                document.querySelectorAll('[data-section]').forEach(el => el.classList.remove('active'));
                button.classList.add('active');
                renderSection(button.getAttribute('data-section'));
            });
        });

        applyLanguage('en');
    </script>
</body>

</html>
